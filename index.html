<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇美醫院教學部討論室預約系統</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tippy.js for custom tooltips -->
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/app.css">

</head>
<body class="text-slate-800">

    <!-- 動態背景裝飾 -->
    <div class="bg-shapes">
        <div class="bg-shape-1"></div>
        <div class="bg-shape-2"></div>
    </div>

    <!-- 全域載入遮罩 -->
    <div id="loader" class="fixed inset-0 z-[100] bg-slate-900 bg-opacity-40 flex flex-col justify-center items-center pointer-events-none opacity-0 transition-opacity duration-300 backdrop-blur-sm">
        <div class="loader-spinner mb-4 bg-white rounded-full p-1 shadow-lg"></div>
        <p class="text-white font-medium text-lg drop-shadow-md tracking-wide">處理中，請稍候...</p>
    </div>

    <!-- 系統頂部導覽列 Navbar -->
    <nav class="system-navbar fixed top-0 w-full z-40 h-auto min-h-[4rem] py-2 sm:py-0 sm:h-16 flex items-center justify-center border-b border-slate-200/60">
        <div class="w-full max-w-[85rem] px-3 sm:px-4 md:px-8 flex items-center justify-between h-full">
            <div class="flex items-center gap-2 sm:gap-3 md:gap-4">
                <!-- 奇美教學部 Logo -->
                <img src="https://raw.githubusercontent.com/Luyun1224/DiscussionRoomRegistrationSystem/main/%E6%95%99%E5%AD%B8%E9%83%A8-LOGO(%E9%BB%91%E8%89%B2).png" alt="奇美醫院教學部" class="h-6 sm:h-8 md:h-10 object-contain drop-shadow-sm flex-shrink-0">
                
                <div class="h-4 sm:h-5 w-px bg-slate-300 mx-0.5 sm:mx-1 flex-shrink-0"></div>
                
                <!-- 系統名稱 -->
                <h1 class="text-[13px] sm:text-base md:text-lg font-bold text-slate-800 tracking-tight sm:tracking-wider leading-tight">
                    奇美醫院教學部<br class="block sm:hidden">討論室預約系統
                    <span class="text-[9px] sm:text-xs text-white bg-[#007AC1] px-1.5 py-0.5 rounded-full ml-1 align-middle font-normal shadow-sm relative -top-0.5 sm:top-0">線上版</span>
                </h1>
            </div>
            
            <!-- 系統時間小工具 -->
            <div class="flex-shrink-0 flex items-center gap-1 sm:gap-2 text-[10px] sm:text-sm font-semibold text-slate-600 bg-slate-100/80 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg border border-slate-200/50">
                <svg class="w-3 h-3 sm:w-4 sm:h-4 text-[#007AC1]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="system-clock" class="tracking-wider w-[50px] sm:w-[68px] text-center">00:00:00</span>
            </div>
        </div>
    </nav>

    <!-- 歡迎橫幅 Sub-Header (全寬設計，與 Navbar 無縫連接) -->
    <div class="bg-[#002D62] relative overflow-hidden mt-14 sm:mt-16 pt-6 sm:pt-10 pb-16 sm:pb-20 z-0 shadow-inner">
        <!-- 裝飾性幾何圖形 -->
        <div class="absolute top-0 right-0 -mt-10 -mr-10 w-64 h-64 bg-[#007AC1] opacity-30 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-0 left-10 -mb-10 w-48 h-48 bg-[#EF3B24] opacity-20 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="max-w-[85rem] mx-auto px-4 md:px-8 flex flex-col md:flex-row items-center justify-between relative z-10">
            <div class="text-center md:text-left">
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-2 tracking-wide drop-shadow-md">歡迎使用空間預約服務</h2>
                <p class="text-blue-100 text-base md:text-lg font-medium drop-shadow">即時查看與預約，讓會議安排更輕鬆有效率。</p>
            </div>

            <!-- 控制列 -->
            <div class="mt-6 md:mt-0 flex flex-col sm:flex-row items-center bg-white/10 backdrop-blur-md p-3 md:p-4 rounded-xl border border-white/20 gap-3 shadow-inner">
                <div class="flex items-center gap-3">
                    <label for="date-picker" class="font-bold text-white drop-shadow-sm whitespace-nowrap">快速跳轉：</label>
                    <input type="date" id="date-picker" class="border border-white/30 bg-white/90 rounded-lg p-2 focus:ring-2 focus:ring-[#007AC1] focus:border-[#007AC1] text-slate-800 cursor-pointer transition-colors outline-none shadow-sm font-medium">
                </div>
                <button id="btn-today" class="w-full sm:w-auto px-5 py-2 bg-white/20 hover:bg-white/30 text-white font-bold rounded-lg transition-all border border-white/30 shadow-sm hover:shadow">
                    回到今日
                </button>
            </div>
        </div>
    </div>

    <!-- 主要內容區 (使用負 Margin 向上重疊，營造層次感) -->
    <div class="max-w-[85rem] mx-auto px-4 md:px-8 pb-12 space-y-6 md:space-y-8 relative z-10 -mt-10">
        
        <!-- 日時間表區塊 (Premium Card) -->
        <div class="premium-card overflow-hidden">
            <div class="border-b border-slate-100 p-5 bg-white/50 backdrop-blur-md flex items-center justify-between">
                <h2 class="text-xl font-bold text-slate-800 flex items-center">
                    <div class="p-1.5 bg-blue-50 rounded-lg mr-3 border border-blue-100">
                        <svg class="w-6 h-6 text-[#007AC1]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    </div>
                    當日預約狀況 <span id="schedule-date-display" class="ml-3 text-sm font-medium text-slate-500 bg-slate-100 px-2 py-1 rounded-md"></span>
                </h2>
                <div class="hidden sm:flex gap-4 text-sm font-medium text-slate-500">
                    <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-[#002D62] mr-2"></span>討論室</div>
                    <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-[#007AC1] mr-2"></span>多功能室</div>
                </div>
            </div>
            <div class="overflow-x-auto custom-scrollbar bg-white/30">
                <div id="schedule-container" class="min-w-[1000px] p-6 relative">
                    <!-- 時間表將由 JS 動態生成 -->
                </div>
            </div>
        </div>

        <!-- 月曆區塊 (Premium Card) -->
        <div id="calendar-wrapper" class="premium-card p-6">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-xl font-bold text-slate-800 flex items-center">
                    <div class="p-1.5 bg-blue-50 rounded-lg mr-3 border border-blue-100">
                        <svg class="w-6 h-6 text-[#007AC1]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    月曆總覽
                </h2>
                <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 p-1 rounded-xl shadow-sm">
                    <button id="prev-month-btn" class="p-2 rounded-lg hover:bg-white hover:shadow-sm text-slate-600 transition-all" title="上個月">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h2 id="calendar-month-year" class="text-lg font-bold text-slate-800 min-w-[130px] text-center tracking-wide"></h2>
                    <button id="next-month-btn" class="p-2 rounded-lg hover:bg-white hover:shadow-sm text-slate-600 transition-all" title="下個月">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="grid grid-cols-7 text-center font-bold text-slate-500 mb-3 text-sm">
                <div class="text-red-500">週日</div><div>週一</div><div>週二</div><div>週三</div><div>週四</div><div>週五</div><div class="text-red-500">週六</div>
            </div>
            <div id="calendar-grid" class="calendar-grid">
                <!-- 日曆網格將由 JS 動態生成 -->
            </div>
        </div>
    </div>

    <!-- 模態框 (預約) -->
    <div id="booking-modal" class="fixed inset-0 z-50 flex justify-center items-center p-3 sm:p-4 modal-backdrop modal-hidden pointer-events-none bg-slate-900/40">
        <div class="modal-content bg-white rounded-2xl shadow-2xl p-5 sm:p-6 md:p-8 w-full max-w-lg relative pointer-events-auto border-t-4 border-[#007AC1] max-h-[90vh] overflow-y-auto custom-scrollbar">
            <button class="close-modal-btn absolute top-3 right-3 sm:top-4 sm:right-4 text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-full p-2 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <h3 class="text-2xl font-bold mb-6 text-slate-800 flex items-center border-b pb-4">
                <span class="w-2 h-6 bg-[#007AC1] rounded-full mr-3"></span>
                新增預約
            </h3>
            
            <div class="bg-[#f0f7fb] border border-[#b3def6] p-4 rounded-xl mb-6 flex flex-wrap gap-4 justify-between text-center items-center shadow-inner">
                <div class="flex-1 min-w-[80px]"><p class="text-xs text-slate-500 mb-1 font-medium">場地</p><p id="modal-room-name" class="font-bold text-lg text-[#002D62]"></p></div>
                <div class="w-px h-10 bg-[#b3def6] hidden sm:block"></div>
                <div class="flex-1 min-w-[80px]"><p class="text-xs text-slate-500 mb-1 font-medium">日期</p><p id="modal-date" class="font-semibold text-slate-800"></p></div>
                <div class="w-px h-10 bg-[#b3def6] hidden sm:block"></div>
                <div class="flex-1 min-w-[120px] flex items-center justify-center gap-2">
                    <div>
                        <p class="text-xs text-slate-500 mb-1 font-medium">從</p>
                        <p id="modal-start-time" class="font-bold text-[#007AC1] bg-white px-2 py-1 rounded border border-blue-100 shadow-sm"></p>
                    </div>
                    <span class="text-slate-400 mt-4">-</span>
                    <div>
                        <p class="text-xs text-slate-500 mb-1 font-medium">到</p>
                        <select id="end-time-select" class="font-bold text-[#007AC1] bg-white border border-blue-200 rounded shadow-sm focus:ring-2 focus:ring-[#007AC1] px-2 py-1 cursor-pointer outline-none"></select>
                    </div>
                </div>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label for="booker-name" class="block text-sm font-bold text-slate-700 mb-1">借用者姓名 <span class="text-red-500">*</span></label>
                    <input type="text" id="booker-name" class="input-field" placeholder="請輸入單位與姓名 (例：教學部 王大明)">
                </div>
                <div>
                    <label for="booker-contact" class="block text-sm font-bold text-slate-700 mb-1">聯絡方式 <span class="text-red-500">*</span></label>
                    <input type="text" id="booker-contact" class="input-field" placeholder="請輸入分機或手機號碼">
                </div>
                <div>
                    <label for="booking-purpose" class="block text-sm font-bold text-slate-700 mb-1">預定用途 <span class="text-red-500">*</span></label>
                    <textarea id="booking-purpose" rows="3" class="input-field resize-none" placeholder="請簡述會議或活動內容"></textarea>
                </div>
            </div>
            
            <div class="mt-8 flex justify-end gap-3">
                <button class="close-modal-btn px-6 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-lg hover:bg-slate-200 transition-colors border border-slate-200">取消</button>
                <button id="confirm-booking-btn" class="px-6 py-2.5 btn-primary rounded-lg font-bold flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    確認預約
                </button>
            </div>
        </div>
    </div>

    <!-- 模態框 (編輯) -->
    <div id="edit-modal" class="fixed inset-0 z-50 flex justify-center items-center p-3 sm:p-4 modal-backdrop modal-hidden pointer-events-none bg-slate-900/40">
        <div class="modal-content bg-white rounded-2xl shadow-2xl p-5 sm:p-6 md:p-8 w-full max-w-lg relative pointer-events-auto border-t-4 border-amber-500 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <button class="close-modal-btn absolute top-3 right-3 sm:top-4 sm:right-4 text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-full p-2 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <h3 class="text-2xl font-bold mb-6 text-slate-800 flex items-center border-b pb-4">
                <span class="w-2 h-6 bg-amber-500 rounded-full mr-3"></span>
                檢視 / 編輯預約
            </h3>
            
            <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl mb-6 flex flex-wrap gap-4 justify-between text-center items-center shadow-inner">
                <div class="flex-1 min-w-[80px]"><p class="text-xs text-slate-500 mb-1 font-medium">場地</p><p id="edit-modal-room-name" class="font-bold text-lg text-amber-700"></p></div>
                <div class="w-px h-10 bg-amber-200 hidden sm:block"></div>
                <div class="flex-1 min-w-[80px]"><p class="text-xs text-slate-500 mb-1 font-medium">日期</p><p id="edit-modal-date" class="font-semibold text-slate-800"></p></div>
                <div class="w-px h-10 bg-amber-200 hidden sm:block"></div>
                <div class="flex-1 min-w-[120px] flex items-center justify-center gap-2">
                    <div>
                        <p class="text-xs text-slate-500 mb-1 font-medium">從</p>
                        <p id="edit-modal-start-time" class="font-bold text-amber-600 bg-white px-2 py-1 rounded border border-amber-100 shadow-sm"></p>
                    </div>
                    <span class="text-slate-400 mt-4">-</span>
                    <div>
                        <p class="text-xs text-slate-500 mb-1 font-medium">到</p>
                        <select id="edit-end-time-select" class="font-bold text-amber-600 bg-white border border-amber-200 rounded shadow-sm focus:ring-2 focus:ring-amber-500 px-2 py-1 cursor-pointer outline-none"></select>
                    </div>
                </div>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label for="edit-booker-name" class="block text-sm font-bold text-slate-700 mb-1">借用者姓名</label>
                    <input type="text" id="edit-booker-name" class="input-field">
                </div>
                <div>
                    <label for="edit-booker-contact" class="block text-sm font-bold text-slate-700 mb-1">聯絡方式</label>
                    <input type="text" id="edit-booker-contact" class="input-field">
                </div>
                <div>
                    <label for="edit-booking-purpose" class="block text-sm font-bold text-slate-700 mb-1">預定用途</label>
                    <textarea id="edit-booking-purpose" rows="3" class="input-field resize-none"></textarea>
                </div>
            </div>
            
            <div class="mt-8 flex flex-col-reverse sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-100">
                 <button id="trigger-cancel-btn" class="w-full sm:w-auto px-4 py-2.5 text-red-600 hover:text-red-700 hover:bg-red-50 font-bold rounded-lg transition-colors border border-transparent hover:border-red-200 flex items-center justify-center">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    取消此預約
                 </button>
                 <div class="w-full sm:w-auto flex gap-3">
                    <button class="close-modal-btn flex-1 px-6 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-lg hover:bg-slate-200 transition-colors border border-slate-200">關閉</button>
                    <button id="confirm-edit-btn" class="flex-1 px-6 py-2.5 btn-primary rounded-lg font-bold flex items-center justify-center">
                        儲存變更
                    </button>
                 </div>
            </div>
        </div>
    </div>

    <!-- 模態框 (系統訊息/確認框) -->
    <div id="alert-modal" class="fixed inset-0 z-[110] flex justify-center items-center p-4 modal-backdrop modal-hidden pointer-events-none bg-slate-900/50">
        <div class="modal-content bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-sm text-center relative pointer-events-auto max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div id="alert-icon-container" class="mx-auto w-16 h-16 mb-4 flex items-center justify-center rounded-full bg-blue-100 text-blue-600">
                <!-- Icon will be injected here -->
            </div>
            <h4 id="alert-title" class="text-xl font-bold text-slate-800 mb-2">系統訊息</h4>
            <p id="alert-message" class="text-slate-600 mb-8 font-medium"></p>
            <div id="alert-buttons" class="flex justify-center gap-3">
                <!-- Buttons will be injected here -->
            </div>
        </div>
    </div>

    <script type="module" src="assets/app.js"></script>

</body>
</html>
